<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TechStart Portal - {{ action }} Project</title>
    <style>
        body { font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:#f5f5f5; padding:20px; }
        .navbar {
            background:#667eea; color:white; padding:15px 30px;
            border-radius:10px; margin-bottom:30px; display:flex;
            justify-content:space-between; align-items:center;
        }
        .navbar a { color:white; text-decoration:none; padding:8px 16px; background:rgba(255,255,255,0.2); border-radius:5px; }
        .card {
            max-width:600px; margin:0 auto; background:white; padding:30px;
            border-radius:10px; box-shadow:0 5px 15px rgba(0,0,0,0.1);
        }
        .form-group { margin-bottom:20px; }
        label { display:block; margin-bottom:5px; font-weight:600; font-size:13px; text-transform:uppercase; color:#555; }
        input[type="text"], textarea, select {
            width:100%; padding:10px; border-radius:5px; border:1px solid #ddd; font-size:14px;
        }
        textarea { min-height:120px; }
        button {
            padding:10px 16px; border:none; border-radius:5px;
            background:#667eea; color:white; cursor:pointer; font-size:14px;
        }
    </style>
</head>
<body>
<div class="navbar">
    <h2>{{ action }} Project</h2>
    <div>
        <a href="/projects">Back to Projects</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="card">
    <form method="POST">
        <div class="form-group">
            <label for="name">Project Name</label>
            <input type="text" id="name" name="name"
                   required
                   value="{{ project.name if project is defined else '' }}">
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description">{{ project.description if project is defined else '' }}</textarea>
        </div>

        <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status">
                {% set current_status = project.status if project is defined else 'New' %}
                {% for s in ['New', 'In Progress', 'Blocked', 'Completed'] %}
                  <option value="{{ s }}" {% if s == current_status %}selected{% endif %}>{{ s }}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit">{{ action }} Project</button>
    </form>
</div>
</body>
</html>
