# /etc/systemd/journald.conf (excerpt: lines I uncommented/changed under [Journal])

[Journal]
#to keep data even after power off:
Storage=persistent
#so logs don't fill the disk:
SystemMaxUse=200M
#journald will stop growing earlier if free space drops to 200MB:
SystemKeepFree=200M
#keeps logs up to 30 days if it does not reach the storage capacity before:
MaxRetentionSec=30day
