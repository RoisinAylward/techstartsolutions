# Port 443: serves the Flask app through mod_wsgi over TLS (self-signed certificate).
# ServerName was the VM's public IP; FLASK_SECRET_KEY value removed.
<VirtualHost *:443>
    ServerName <vm-public-ip>

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/techstart.crt
    SSLCertificateKeyFile /etc/apache2/ssl/techstart.key

    WSGIDaemonProcess flaskapp_ssl python-home=/var/www/flaskapp/venv python-path=/var/www/flaskapp
    WSGIProcessGroup flaskapp_ssl
    WSGIScriptAlias / /var/www/flaskapp/flaskapp.wsgi

    <Directory /var/www/flaskapp>
        Require all granted
    </Directory>

    Alias /static /var/www/flaskapp/static
    <Directory /var/www/flaskapp/static>
        Require all granted
    </Directory>

    SetEnv KEY_VAULT_NAME techstart-kv
    SetEnv BLOB_CONTAINER_NAME app-files
    SetEnv SQL_SECRET_NAME sql-connection-string
    SetEnv STORAGE_SECRET_NAME storage-connection-string
    SetEnv FLASK_SECRET_KEY <removed>

    ErrorLog ${APACHE_LOG_DIR}/flaskapp_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/flaskapp_ssl_access.log combined
</VirtualHost>
