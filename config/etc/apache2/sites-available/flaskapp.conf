# Port 80: only redirects every request to HTTPS (301).
# ServerName was the VM's public IP; FLASK_SECRET_KEY value removed.
<VirtualHost *:80>
    ServerName <vm-public-ip>
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
    WSGIDaemonProcess flaskapp python-home=/var/www/flaskapp/venv python-path=/var/www/flaskapp
    WSGIProcessGroup flaskapp
    WSGIScriptAlias / /var/www/flaskapp/flaskapp.wsgi
    <Directory /var/www/flaskapp>
        Require all granted
    </Directory>
    Alias /static /var/www/flaskapp/static
    <Directory /var/www/flaskapp/static>
        Require all granted
    </Directory>
    SetEnv KEY_VAULT_NAME techstart-kv
    SetEnv BLOB_CONTAINER_NAME app-files
    SetEnv SQL_SECRET_NAME sql-connection-string
    SetEnv STORAGE_SECRET_NAME storage-connection-string
    SetEnv FLASK_SECRET_KEY <removed>
    ErrorLog ${APACHE_LOG_DIR}/flaskapp_error.log
    CustomLog ${APACHE_LOG_DIR}/flaskapp_access.log combined
</VirtualHost>
