# /etc/security/pwquality.conf (excerpt: settings I enabled)

# At least 4 characters must differ from the old password
difok = 4
# Minimum length of 12
minlen = 12
# At least one digit, one uppercase, one lowercase and one special character
dcredit = -1
ucredit = -1
lcredit = -1
ocredit = -1
# No more than 3 of the same character in a row
maxrepeat = 3
# Reject passwords containing the username, or 3+ character chunks of it
usercheck = 1
usersubstr = 3
# Give up after 3 failed attempts at choosing a new password
retry = 3
# Apply the same rules to root
enforce_for_root
